<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/flashpay_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="FlashPay - Fast payments, team recharge, UPI account binding, and quota rewards." />
    <title>FlashPay</title>
  </head>
  <body>
    <div id="root">
      <div style="
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 99999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      ">
        <img
          src="/flashpay_logo.png"
          alt="FlashPay"
          style="
            width: 90px;
            height: 90px;
            border-radius: 22px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.28);
            margin-bottom: 14px;
            animation: pulseLogo 1.6s infinite ease-in-out;
          "
        />
        <div style="font-size: 24px; font-weight: 900; color: #0f172a; letter-spacing: -0.5px;">
          Flash<span style="color: #2563eb;">Pay</span>
        </div>
        <div style="font-size: 12px; color: #64748b; font-weight: 500; margin-top: 4px;">
          Fast & Secure Payments
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
